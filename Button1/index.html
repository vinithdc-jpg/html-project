<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Animated 3D Buttons</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Circular Animated 3D Buttons</h1>
        
        <button class="button-3d">
            <div class="icon">
                <i class="fas fa-rocket"></i>
            </div>
            <span class="button-text">Launch Project</span>
        </button>
        
        <div class="variations">
            <button class="button-variant variant-1">
                <i class="fas fa-heart"></i>
                <span>Like</span>
            </button>
            
            <button class="button-variant variant-2">
                <i class="fas fa-share-alt"></i>
                <span>Share</span>
            </button>
            
            <button class="button-variant variant-3">
                <i class="fas fa-star"></i>
                <span>Favorite</span>
            </button>
        </div>
        
        <div class="info">
            <p>Click the buttons to see the 3D press effect. Hover over any button to see the circular border animation.</p>
        </div>
    </div>

    <script>
        // Add click animation to all buttons
        document.querySelectorAll('.button-3d, .button-variant').forEach(button => {
            button.addEventListener('click', function() {
                this.style.transform = 'translateY(5px)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
